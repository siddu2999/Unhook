<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusTube</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>FocusTube</h1>
        <p class="subtitle">Distraction-free YouTube</p>

        <div class="setting">
            <div>
                <h3>Hide Shorts</h3>
                <p>Remove YouTube Shorts</p>
            </div>

            <label class="switch">
                <input type="checkbox" id="shorts">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting">
            <div>
                <h3>Hide Recommendations</h3>
                <p>Remove recommended videos</p>
            </div>

            <label class="switch">
                <input type="checkbox" id="recommendations">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting">
            <div>
                <h3>Hide Comments</h3>
                <p>Remove the comments section</p>
            </div>

            <label class="switch">
                <input type="checkbox" id="comments">
                <span class="slider"></span>
            </label>
        </div>

        <div class="footer">
            FocusTube
        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
